name: Refresh astronomy data

on:
  schedule:
    # Every 6 hours. Cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch and normalize latest astronomy data
        env:
          # Optional: add a free key from https://api.nasa.gov as a repo secret
          # named NASA_API_KEY for a higher rate limit than the shared DEMO_KEY.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: npm run fetch

      - name: Commit updated data.json
        run: |
          git config user.name "astrohub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --quiet --cached || git commit -m "Refresh astronomy data [automated]"
          git push
